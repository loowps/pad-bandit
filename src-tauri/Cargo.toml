[package]
name = "pad-bandit-tauri"
version = "0.1.0"
description = "SP404SX pad and bank editor"
edition = "2024"

[lib]
name = "pad_bandit_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
