[package]
name = "pad-bandit-tauri"
version = "0.1.0"
description = "SP-404SX pad and bank editor"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "pad_bandit_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dunce = "1"
cpal = "0.18.2"
rubato = "5.0.0"
rtrb = "0.4.0"
# all-meta stays: without the ID3/APE readers the probe scans a tag byte by byte for an MP3 sync word
symphonia = { version = "0.6.1", default-features = false, features = [
    "opt-simd",
    "all-meta",
    "wav",
    "aiff",
    "pcm",
    "adpcm",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
] }

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
