name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: pnpm check

      - name: Types
        run: pnpm type-check

      - name: Unit tests
        working-directory: src-ui
        run: pnpm exec vitest --run --reporter=default --reporter=github-actions

      - name: Build what the end-to-end run serves
        run: pnpm build-only

      - name: Browser for Playwright
        working-directory: src-ui
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        timeout-minutes: 10
        run: pnpm test:e2e

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: src-ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    # Windows and macOS are the release targets. Linux is built and tested for
    # information only, so a breakage there does not block a pull request.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            optional: false
          - platform: macos-latest
            optional: false
          - platform: ubuntu-latest
            optional: true
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries Tauri and cpal build against
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        if: runner.os != 'Linux'
        run: cargo test --locked

      - name: Tests, without the ones that need a sound card
        if: runner.os == 'Linux'
        run: cargo test --locked --lib
