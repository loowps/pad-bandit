<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pad Bandit</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }

      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        background-color: #f5f5f7;
      }

      .app-loading-logo {
        width: 132px;
        height: auto;
      }

      .app-loading-body {
        fill: #4c5363;
      }

      .app-loading-pad {
        fill: #a9b7c4;
        transform-box: fill-box;
        transform-origin: center;
      }

      .app-loading-pad--lit {
        animation: app-loading-pad 2.2s infinite ease-in-out;
        animation-delay: calc(var(--pad) * 0.09s);
      }

      @keyframes app-loading-pad {
        0% {
          fill: #a9b7c4;
          transform: scale(0.88);
        }

        4%,
        52% {
          fill: #f58960;
          transform: scale(1);
        }

        62%,
        100% {
          fill: #a9b7c4;
          transform: scale(0.88);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading-pad--lit {
          animation-duration: 6s;
          animation-delay: calc(var(--pad) * 0.25s);
        }

        @keyframes app-loading-pad {
          0% {
            fill: #a9b7c4;
          }

          4%,
          52% {
            fill: #f58960;
          }

          62%,
          100% {
            fill: #a9b7c4;
          }
        }
      }
    </style>
  </head>
  <body>
    <noscript>This editor needs JavaScript to run.</noscript>
    <div id="app">
      <div class="app-loading">
        <svg
          class="app-loading-logo"
          viewBox="0 0 39.158 26.56"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Loading"
        >
          <rect class="app-loading-body" x="0" y="0" width="39.158" height="26.56" rx="0.946" />

          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 0" x="2.849" y="18.421" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad" x="11.810" y="18.421" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 1" x="20.771" y="18.421" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 2" x="29.733" y="18.421" width="6.577" height="5.513" rx="0.636" />

          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 3" x="2.849" y="10.523" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 4" x="11.810" y="10.523" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 5" x="20.771" y="10.523" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 6" x="29.733" y="10.523" width="6.577" height="5.513" rx="0.636" />

          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 7" x="2.849" y="2.626" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 8" x="11.810" y="2.626" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 9" x="20.771" y="2.626" width="6.577" height="5.513" rx="0.636" />
          <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 10" x="29.733" y="2.626" width="6.577" height="5.513" rx="0.636" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
