<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pad Bandit</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }

      .app-loading {
        --loading-surface: #f4f5f7;
        --loading-logo-body: #30353d;
        --loading-pad-empty: #aab3c0;
        --loading-pad-lit: #fa7d51;

        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--loading-surface);
        transition: opacity 200ms ease-out;
      }

      .app-loading.is-done {
        pointer-events: none;
        opacity: 0;
      }

      .app-loading-logo {
        width: 99px;
        height: auto;
      }

      .app-loading-body {
        fill: var(--loading-logo-body);
      }

      .app-loading-pad {
        --pad-fill: var(--loading-pad-empty);

        fill: var(--loading-pad-empty);
        transform-box: fill-box;
        transform-origin: center;
        animation:
          app-loading-pad-in 340ms ease-out calc(var(--pad) * 55ms) both,
          app-loading-pad-fill 340ms ease-out calc(var(--pad) * 55ms) both,
          app-loading-pad-breathe 2.4s ease-in-out 950ms infinite;
      }

      .app-loading-pad--lit {
        --pad-fill: var(--loading-pad-lit);
      }

      @keyframes app-loading-pad-in {
        from {
          transform: scale(0.88);
        }

        to {
          transform: scale(1);
        }
      }

      @keyframes app-loading-pad-fill {
        to {
          fill: var(--pad-fill);
        }
      }

      @keyframes app-loading-pad-breathe {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(0.94);
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-loading {
          --loading-surface: #15171b;
          --loading-logo-body: #e4e7ec;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading {
          transition: none;
        }

        .app-loading-pad {
          fill: var(--pad-fill);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>This editor needs JavaScript to run.</noscript>
    <div id="app"></div>
    <div id="app-loading" class="app-loading">
      <svg
        class="app-loading-logo"
        viewBox="0 0 39.158 26.56"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="Loading"
      >
        <rect class="app-loading-body" x="0" y="0" width="39.158" height="26.56" rx="0.946" />

        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 0" x="2.849" y="18.421" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad" style="--pad: 1" x="11.810" y="18.421" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 2" x="20.771" y="18.421" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 3" x="29.733" y="18.421" width="6.577" height="5.513" rx="0.636" />

        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 4" x="2.849" y="10.523" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 5" x="11.810" y="10.523" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 6" x="20.771" y="10.523" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 7" x="29.733" y="10.523" width="6.577" height="5.513" rx="0.636" />

        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 8" x="2.849" y="2.626" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 9" x="11.810" y="2.626" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 10" x="20.771" y="2.626" width="6.577" height="5.513" rx="0.636" />
        <rect class="app-loading-pad app-loading-pad--lit" style="--pad: 11" x="29.733" y="2.626" width="6.577" height="5.513" rx="0.636" />
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
